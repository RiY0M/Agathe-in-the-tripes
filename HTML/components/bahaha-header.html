<script>
    class BahahaHeader extends HTMLElement {
        constructor() {
            super();
            const template = document.getElementById("bahaha-header").content;
            const shadowRoot = this.attachShadow({ mode: "open" })
                .appendChild(template.cloneNode(true));
        }

    customElements.define("bahaha-header", BahahaHeader);
