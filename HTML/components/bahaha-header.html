<!DOCTYPE html>
<html lang="en">
<head>
    <title></title>
    <meta charset="UTF-8">
    <style>
        @import url("../../CSS/index.css");

        header {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;

            padding: 1rem;
            vertical-align: baseline;

            background-color: var(--gray);   
            border-bottom: 2px solid var(--darkgray);

            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #header-buttons {
            display: flex;
            flex-direction: row;
            gap: 2rem;
        }

        #player-name {
            text-align: right;
            margin-right: 3rem;
        }

        #agathe-img {
            height: 50px;

            position: absolute;
            top: 0.25rem;
            right: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div id="header-buttons">
            <a id="accueil" href="../index.html" target="_parent">Accueil</a>
            <a id="dashboard" href="../leaderboard.html" target="_parent">Scores</a>
            <a id="credits" href="../credits.html" target="_parent">Crédits</a>
        </div>
        <a id="player-name" href="../loginRegister.html" target="_parent">Invité</a>
        <img id="agathe-img" src="../../img/agathe.png" alt="agathe">
    </header>

    <script src="../../JS/createCookiesFromData.js"></script>
    <script>
        const pseudo = getCookie("login"); // récupération de la valeur du cookie "login"

        if(pseudo) {
            const pseudoElement = document.getElementById("player-name");
            pseudoElement.textContent = pseudo;
            pseudoElement.href = "../logout.html";
        }
    </script>
</body>
</html>
