<!DOCTYPE html>
<html lang="en">
<head>
    <title></title>
    <link rel="stylesheet" href="../../../CSS/index.css">
    <meta charset="UTF-8">
    <style>
        .loginRegister {
            display: flex;
            flex-direction: row;
            justify-content: center;
            border-radius: 5px;
            flex : 1;

            background-color: var(--gray);
            box-shadow: 10px 10px 10px var(--darkgray);

            padding: 1rem;
        }

        #login, #register {
            flex: 1;
            padding: 20px;
        }

        #loginFormulaire, #registerFormulaire {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #loginFormulaire input[type=text],
        #registerFormulaire input[type=text],
        #loginFormulaire input[type=password],
        #registerFormulaire input[type=password] {
            margin-bottom: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
        
            background-color: var(--lightgray);
            color: var(--white);
        }

        #loginFormulaire input[type=submit],
        #registerFormulaire input[type=submit] {
            margin-bottom: 10px;
            margin-top: 1rem;
            width: 110%;
            padding: 10px;
            border-radius: 5px;
        
            cursor: pointer;
            background-color: var(--darkgray);
            color: var(--white);
            font-family: 'Rubik', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            text-shadow: 2px 2px var(--gray);
        }

        #loginFormulaire input[type=submit]:hover,
        #registerFormulaire input[type=submit]:hover {
            color: var(--red);
        }

        .cancel-croix-pop-up {
            position: absolute;
            cursor: pointer;
            transition: background-color 0.3s ease;
            transform: rotate(45deg);
            font-weight: bold;
        }

        #croix-log-regis {
            left: 95%;
            top: 2%;
            width: 5%;
            height: 3%;    
        }

        .cancel-croix-pop-up::before, .cancel-croix-pop-up::after {
            content: '';
            position: absolute;
            background-color: var(--black);
            width: 100%;
            height: 5px;
            top: 50%;
            left: 0;
        }

        .cancel-croix-pop-up::after {
            transform: rotate(90deg);
        }

        .cancel-croix-pop-up:hover::before, .cancel-croix-pop-up:hover::after {
            background-color: var(--red);
        }
    </style>
</head>
<body>
    <div class="loginRegister">
        <div id="croix-log-regis" class="cancel-croix-pop-up"></div>
        <div id="login">
            <form id="loginFormulaire">
                <h1>Se connecter</h1>
                <input id="loginLog" type="text" name="pseudo" placeholder="Pseudo" required>
                <input id="loginMdp" type="password" name="password" placeholder="Mot de passe" required>
                <input id="emptyBtn" type="password" name="password" placeholder="Mot de passe" style="visibility: hidden;">
                <input id="loginBtn" type="submit" value="Connexion">
                <span id="loginSpanErreur"></span>
            </form>
        </div>
    
        <div id="register">
            <form id="registerFormulaire">
                <h1>S'inscrire</h1>
                <input id="registerLog" type="text" name="pseudo" placeholder="Pseudo" required>
                <input id="registerMdp" type="password" name="password" placeholder="Mot de passe" required>
                <input id="registerMdpVerif" type="password" name="password" placeholder="Vérifier votre mot de passe" required>
                <input id="registerBtn" type="submit" value="Inscription">
                <span id="RegisterSpanErreur"></span>
            </form>
        </div>
    </div>

    <script>
        "use strict";

        const loginForm = document.getElementById('loginFormulaire');
        const registerForm = document.getElementById('registerFormulaire');
        const msgErreurLog = document.querySelector("#loginSpanErreur");
        const msgErreurReg = document.querySelector("#RegisterSpanErreur");

        //fonction register
        async function register(login, mdp) {

            const json = await callAPI("newUser", {
                error: "Not connected to db"
            },
            {
                login: login,
                mdp: mdp,
            });

            // console.log(json.data);
            if (json.status == 'success') {
                // L'Authentification a réussi
                const msgErreur = await connectUser(login, mdp);

                if(msgErreur) messageErreur(msgErreur, msgErreurReg);
            }
            messageErreur(json.message, msgErreurReg);
        }

        async function connectUser(login, mdp) {
            try {
                let json = await callAPI("connexion", {
                    error: "Not connected to db"
                },
                {
                    login: login,
                    mdp: mdp,
                });

                if (json.status !== "success") {
                    console.log(json.message);
                    return json.message;
                }

                supprimeTousLesCookies();
                createCookiesFromData(json.data);

                json = await callAPI("getGame", {
                    level_id: 0,
                    HpRemain: 3,
                    nbDynamite: 0
                });
                createCookiesFromData(json.data);

                window.location.replace("index.html");
                return "";
            } catch (error) {
                console.error("Error:", error);
                // Handle errors here
                return "An error occurred during login.";
            }
        }

        ///////////////////////// LOGIN /////////////////////////

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            //console.log("LOGIN FORM");

            const loginLog = document.querySelector('#loginLog').value;
            const passwordLog = document.querySelector('#loginMdp').value;

            const msgErreur = await connectUser(loginLog, passwordLog);
            // console.log("BLABLA : ",msgErreur);
            if(msgErreur) messageErreur(msgErreur, msgErreurLog);
        });

        ///////////////////////// REGISTER ////////////////////////

        registerForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            const login = document.querySelector('#registerLog').value;
            const password = document.querySelector('#registerMdp').value;
            const passwordConfirm = document.querySelector('#registerMdpVerif').value;

            if (password === passwordConfirm) await register(login, password);
            else messageErreur("Les mots de passes ne correspondent pas", msgErreurReg);
            
        });

        function messageErreur(msg, spanMsgErreur) {
            spanMsgErreur.style.color = "red";
            spanMsgErreur.innerHTML = msg;
            setTimeout(() => {
                spanMsgErreur.innerHTML = "";
            }, 7000);
        }
    </script>
</body>
</html>
