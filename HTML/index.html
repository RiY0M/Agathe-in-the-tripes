<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/loginRegister.css">
    <link rel="stylesheet" href="../CSS/deconnexion.css">
    <link rel="stylesheet" href="../CSS/popUpNewGame.css">
    <title>Agathe in the tripes</title>
</head>

<header></header>

<body>

    <!-- MENU PRINCIPAL : TITRE + 2/3 BOUTONS -->
    <div id="header-div"></div>

    <div id="main-grid-column">

        <div id="game-name">
            <h1>Agathe in the tripes</h1>
        </div>

        <div id="game-buttons">

            <input type="button" id="login-register-button" value="Connexion / Inscription">
            <input type="button" id="restart-game-button" value="Nouvelle partie">
            <input type="button" id="start-game-button" value="Continuer partie">

        </div>

    </div>
    <!-- MENU PRINCIPAL : TITRE + 2/3 BOUTONS -->



    <!-- FORMULAIRE CONNEXION / INSCRIPTION -->
    <div class="loginRegisterPopUp">
        <div id="croix-log-regis" class="cancel-croix-pop-up"></div>
        <div id="login">
            <form id="loginFormulaire">
                <h1>Se connecter</h1>
                <input id="loginLog" type="text" name="pseudo" placeholder="Pseudo" required>
                <input id="loginMdp" type="password" name="password" placeholder="Mot de passe" required>
                <input id="emptyBtn" type="password" name="password" placeholder="Mot de passe" style="visibility: hidden;">
                <input id="loginBtn" type="submit" value="Connexion">
                <span id="loginSpanErreur"></span>
            </form>
        </div>
    
        <div id="register">
            <form id="registerFormulaire">
                <h1>S'inscrire</h1>
                <input id="registerLog" type="text" name="pseudo" placeholder="Pseudo" required>
                <input id="registerMdp" type="password" name="password" placeholder="Mot de passe" required>
                <input id="registerMdpVerif" type="password" name="password" placeholder="Vérifier votre mot de passe" required>
                <input id="registerBtn" type="submit" value="Inscription">
                <span id="RegisterSpanErreur"></span>
            </form>
    
        </div>
    </div>
    <!-- FORMULAIRE CONNEXION / INSCRIPTION -->



    <!-- FORMULAIRE DECONNEXION -->
    <div id="deconnexion-player">

        <div id="croix-deco" class="cancel-croix-pop-up"></div>

        <div id="deconnexion-title">
            <h1>Se déconnecter</h1>
        </div>

        <div id="deconnexion-buttons">
            <input id="deconnexion-agree-button" type="submit" value="Déconnexion">
            <input id="deconnexion-cancel-button" class="cancel-annuler-pop-up" type="submit" value="Annuler">
        </div>

    </div>
    <!-- FORMULAIRE DECONNEXION -->


    <!-- POP-UP NOUVELLE PARTIE -->
    <div id="pop-up-new-game">

        <div id="croix-pop-up-new-game" class="cancel-croix-pop-up"></div>

        <div id="pop-up-new-game-title">
            <h1>Nouvelle partie</h1>
        </div>

        <div id="pop-up-new-game-subtitle">

        </div>

        <div id="pop-up-new-game-buttons">
            <input id="pop-up-new-game-agree-button" type="submit" value="Continuer">
            <input id="pop-up-new-game-cancel-button" class="cancel-annuler-pop-up" type="submit" value="Annuler">
        </div>

    </div>
    <!-- POP-UP NOUVELLE PARTIE -->

</body>

<footer></footer>

<script src="../JS/createCookiesFromData.js"></script>
<script src="../JS/footer.js"></script>
<script src="../JS/header.js"></script>
<script src="../JS/index.js"></script>
<script src="../JS/loginRegister.js"></script>
<script src="../JS/cancelActions.js"></script>

</html>
